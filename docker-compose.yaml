version: '3.0'

services:
  nsqd0:
    image: nsqio/nsq:v1.3.0
    command: >-
      nsqd
      --log-level debug
      --lookupd-tcp-address nsqlookupd0:4160
      --lookupd-tcp-address nsqlookupd1:4160
      --lookupd-tcp-address nsqlookupd2:4160
      --auth-http-address="nsq-auth:1325"
      --deflate=true
    ports:
      - "127.0.0.1:4150:4150"

  nsqd1:
    image: nsqio/nsq:v1.3.0
    command: >-
      nsqd
      --log-level debug
      --lookupd-tcp-address nsqlookupd0:4160
      --lookupd-tcp-address nsqlookupd1:4160
      --lookupd-tcp-address nsqlookupd2:4160
      --auth-http-address="nsq-auth:1325"
      --deflate=true
    ports:
      - "127.0.0.1:4151:4150"

  nsqlookupd0:
    image: nsqio/nsq:v1.3.0
    command: /nsqlookupd -log-level debug
    ports:
      - "127.0.0.1:4161:4161"

  nsqlookupd1:
    image: nsqio/nsq:v1.3.0
    command: /nsqlookupd -log-level debug
    ports:
      - "127.0.0.1:4162:4161"

  nsqlookupd2:
    image: nsqio/nsq:v1.3.0
    command: /nsqlookupd -log-level debug
    ports:
      - "127.0.0.1:4163:4161"

  nsqadmin:
    image: nsqio/nsq:v1.3.0
    command:
      - nsqadmin
      - --http-address=0.0.0.0:4171
      - --lookupd-http-address=nsqlookupd0:4161
      - --lookupd-http-address=nsqlookupd1:4161
      - --lookupd-http-address=nsqlookupd2:4161
    depends_on:
      - nsqlookupd0
      - nsqlookupd1
      - nsqlookupd2
    ports:
      - "127.0.0.1:4171:4171"

  nsq-auth:
    image: zhimiao/nsq-auth:latest
    restart: always
    command: --secret="jV22WdmaXxHWAiAh"
